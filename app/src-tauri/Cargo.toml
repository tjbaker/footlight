[package]
name = "footlight"
version = "0.8.2"
description = "Footlight — cut 16:9 video into 1080x1920 (9:16) vertical clips."
authors = ["Trevor Baker"]
license = "Apache-2.0"
repository = "https://github.com/tjbaker/footlight"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS-keychain access for the secretStore platform capability (BYOK API key).
# The `apple-native`/`windows-native`/`sync-secret-service` features select the
# platform-native backend on macOS / Windows / Linux respectively.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# System font enumeration for the caption font picker (list_fonts command).
# CoreText on macOS, DirectWrite on Windows, fontconfig on Linux.
font-kit = "0.14"
# Uniquely named, auto-deleted temp files for the frame / track / render
# commands, so concurrent calls never share (and clobber) one path (#249).
tempfile = "3"
# Async subprocesses (#262): every ffmpeg / ffprobe / CLI child is awaited via
# tokio::process instead of blocking a runtime worker, and killed on quit. The
# same tokio Tauri already runs on; `process` / `io-util` / `sync` / `macros`
# add tokio::process, pipe reads, the quit signal (watch) and `select!`.
tokio = { version = "1.52", features = ["process", "io-util", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
# killpg: stopping a child kills its whole process group, so the CLI's ffmpeg
# grandchild goes too (#262). Already in Cargo.lock via tokio.
libc = "0.2"

[dev-dependencies]
# The subprocess tests build their own multi-thread runtime with timers.
tokio = { version = "1.52", features = ["rt-multi-thread", "time"] }
